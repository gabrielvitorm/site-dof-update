services:
  postgres:
    image: postgres:16-alpine
    container_name: dof-update-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dofupdate
      POSTGRES_USER: dof_user
      POSTGRES_PASSWORD: dof_local_dev
    ports:
      - '5432:5432'
    volumes:
      - dof_update_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dof_user -d dofupdate']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dof_update_pgdata:
